name: AgentSession 3 native validation

on:
  pull_request:
    paths:
      - "v3/**"
      - "scripts/v3-*.mjs"
      - "scripts/verify-governance.mjs"
      - "test/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/v3-native.yml"
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v3-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: win32-x64
            runner: windows-latest
          - platform: linux-x64
            runner: ubuntu-latest
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
          - platform: darwin-arm64
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26.5.0
          cache: npm
          cache-dependency-path: |
            package-lock.json
            v3/ui/package-lock.json
            v3/test/browser-tools/package-lock.json

      - name: Set up Rust
        run: |
          rustup toolchain install 1.95.0 --profile minimal --component rustfmt
          rustup override set 1.95.0

      - name: Install locked JavaScript dependencies
        run: |
          npm ci --ignore-scripts
          npm --prefix v3/ui ci

      - name: Install required public browser test tools
        if: matrix.platform == 'linux-x64'
        run: |
          npm --prefix v3/test/browser-tools ci --ignore-scripts
          node v3/test/browser-tools/node_modules/agent-browser/scripts/postinstall.js
          browser_bin="$(pwd)/v3/test/browser-tools/node_modules/agent-browser/bin/agent-browser-linux-x64"
          test -x "$browser_bin"
          "$browser_bin" --version
          "$browser_bin" install --with-deps
          chrome_bin="$(find "$HOME/.agent-browser/browsers" -maxdepth 2 -path '*/chrome-*/chrome' -type f | sort -V | tail -n 1)"
          test -x "$chrome_bin"
          "$chrome_bin" --version
          export AGENTSESSION_V3_AGENT_BROWSER_BIN="$browser_bin"
          export AGENT_BROWSER_EXECUTABLE_PATH="$chrome_bin"
          export AGENTSESSION_V3_REQUIRE_BROWSER=1
          node v3/test/browser-smoke.mjs
          printf 'AGENTSESSION_V3_AGENT_BROWSER_BIN=%s\nAGENT_BROWSER_EXECUTABLE_PATH=%s\nAGENTSESSION_V3_REQUIRE_BROWSER=1\n' "$browser_bin" "$chrome_bin" >> "$GITHUB_ENV"

      - name: Build frontend and validate Rust workspace
        run: |
          npm --prefix v3/ui run build
          cargo fmt --manifest-path v3/Cargo.toml --all -- --check
          cargo test --manifest-path v3/Cargo.toml --workspace --locked

      - name: Build native release
        run: |
          source_root="$(node -p 'process.cwd()')"
          build_home="$(node -p 'require("node:os").homedir()')"
          export RUSTFLAGS="--remap-path-prefix=${source_root}=/agentsession-src --remap-path-prefix=${build_home}=/build-user"
          cargo build --manifest-path v3/Cargo.toml --release --locked --bin agentsession-v3

      - name: Pack portable bundle and select exact executable
        run: |
          node -e 'require("node:assert/strict").equal(`${process.platform}-${process.arch}`, process.argv[1])' "${{ matrix.platform }}"
          executable=agentsession-v3
          if [[ "${{ matrix.platform }}" == "win32-x64" ]]; then executable=agentsession-v3.exe; fi
          mkdir -p tmp
          printf '{}' > tmp/v3-ci-config.json
          node scripts/v3-package-portable.mjs --release-bin "v3/target/release/${executable}" --output-dir "tmp/v3-ci-${{ matrix.platform }}"
          node --input-type=module -e 'import path from "node:path"; import {appendFileSync} from "node:fs"; const exe=process.platform==="win32"?"agentsession-v3.exe":"agentsession-v3"; const bundle=path.resolve(`tmp/v3-ci-${process.platform}-${process.arch}`); const binary=path.join(bundle,exe); appendFileSync(process.env.GITHUB_ENV, `AGENTSESSION_V3_BIN=${binary}\nAGENTSESSION_V3_BINARY=${binary}\nAGENTSESSION_V3_RELEASE_BIN=${binary}\nAGENTSESSION_CONFIG=${path.resolve("tmp/v3-ci-config.json")}\nAGENTSESSION_V3_NPM_HOST_BUNDLE=${bundle}\nAGENTSESSION_V3_NPM_CANDIDATE=1\n`);'

      - name: Validate packaged HTTP, MCP, and standalone behavior
        run: node --test --test-concurrency=1 test/fixture-cleanup.test.mjs v3/test/*.test.mjs

      - name: Pack host npm candidate
        run: |
          case "${{ matrix.platform }}" in
            win32-x64) bundle_flag=--windows-bundle ;;
            linux-x64) bundle_flag=--linux-bundle ;;
            linux-arm64) bundle_flag=--linux-arm64-bundle ;;
            darwin-arm64) bundle_flag=--macos-arm64-bundle ;;
          esac
          node scripts/v3-prepare-npm-candidate.mjs --output-dir "tmp/v3-ci-npm-${{ matrix.platform }}" "${bundle_flag}" "${AGENTSESSION_V3_NPM_HOST_BUNDLE}"
          node scripts/v3-pack-npm-candidate.mjs --stage-dir "tmp/v3-ci-npm-${{ matrix.platform }}"

      - name: Upload unpublished validation bundle
        uses: actions/upload-artifact@v4
        with:
          name: agentsession-v3-${{ matrix.platform }}
          path: |
            tmp/v3-ci-${{ matrix.platform }}/
            tmp/v3-ci-npm-${{ matrix.platform }}/*.tgz
            tmp/v3-ci-npm-${{ matrix.platform }}/native/provenance.json
          if-no-files-found: error
